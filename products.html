<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Our Products</h1>
    <table>
        <style>
            table {
                border-collapse: collapse;
                width: 100%;
            }
            th, td {
                border: 1px solid #ddd;
                padding: 8px;
                text-align: left;
            }
            th {
                background-color: #3d3b3b;
            }
        </style>
        <tr>
            <th>Product</th>
            <th>Description</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Product 1</td>
            <td>Description of Product 1</td>
            <td>$19.99</td>
        </tr>
        <tr>
            <td>Product 2</td>
            <td>Description of Product 2</td>
            <td>$29.99</td>
        </tr>
    </table>
</body>
</html>
